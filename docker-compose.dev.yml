# ══════════════════════════════════════════════════════════════════════════════
#  Yerel geliştirme override'ı
#
#  Kullanım:
#      docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
#  docker-compose.dev.yml OLMADAN çalıştırmak üretim ayarlarını kullanır.
#  Coolify dağıtımında bu dosya HİÇ kullanılmaz — yalnızca `docker-compose.yml`
#  yapıştırılır.
#
#  Farklar:
#    • Kaynak kod bind mount edilir → düzenleme yeniden derleme gerektirmez.
#    • uvicorn --reload açılır.
#    • Alan adı yok, doğrudan http://localhost:8000.
# ══════════════════════════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]

    environment:
      TZ: ${TZ:-Europe/Istanbul}
      # Kod değişikliği yeniden yüklendiğinde supervisor'ın yeniden
      # başlatmasına gerek kalmaması için uvicorn'un kendi --reload'u kullanılır.
      API_DEV_RELOAD: "1"
      # Geliştirmede hata çıktısını görmek için açık.
      DEBUG: ${DEBUG:-1}

    volumes:
      # Kaynak kod. /opt/venv bu mount'un DIŞINDA (imajın kökünde) olduğu için
      # bağımlılıklar korunur.
      #
      # NOT: `plugins:/app/Plugins` ve `state:/state` mount'ları zaten
      # docker-compose.yml'de tanımlı; merge sırasında listeler birleşir.
      # Burada tekrarlanırsa Compose "duplicate mount point" hatası verir.
      # Docker mount'ları hedef yol uzunluğuna göre sıraladığı için
      # ./:/app altındaki /app/Plugins yine volume'den gelir: eklentiler
      # kalıcıdır ve yerelde yaptığınız domain denemeleri kodla karışmaz.
      - ./:/app

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD", "python", "/app/ops/healthcheck.py", "api"]
      # --reload aktifken modül yeniden yüklenir; başlangıç biraz uzar.
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

  domain-updater:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["watcher"]

    environment:
      TZ: ${TZ:-Europe/Istanbul}
      # Yerelde sık sık denemek için: 5 dakikada bir yokla.
      DOMAIN_CHECK_INTERVAL: ${DOMAIN_CHECK_INTERVAL:-300}
      UPDATE_HOUR: ${UPDATE_HOUR:-18}
      UPDATE_MINUTE: ${UPDATE_MINUTE:-0}
      # Güncelleme yapınca API'yi yeniden yüklemek yerine sadece logla:
      # yerelde uvicorn --reload zaten dosya değişimini algılar ve yeniden
      # başlar; çift yeniden başlatma kafa karıştırıcıdır.
      DISABLE_RELOAD_REQUEST: "1"

    depends_on:
      api:
        condition: service_started

volumes:
  plugins:
  state: