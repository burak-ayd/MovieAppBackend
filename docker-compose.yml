# ══════════════════════════════════════════════════════════════════════════════
#  MovieApp — PRODUCTION dağıtımı (Docker Hub imajı)
#
#  Bu dosyada `build:` YOKTUR. İmaj Docker Hub'dan çekilir; sunucuda kaynak
#  kodu veya Docker build zinciri bulunmaz.
#
#  ── Üç dosyanın görevi ──────────────────────────────────────────────────────
#    docker-compose.build.yml → imajı ÜRET ve Docker Hub'a GÖNDER
#                                 (yalnızca geliştirme makinesinde çalıştırılır)
#    docker-compose.yml       → bu dosya; imajı ÇEK ve ÇALIŞTIR
#                                 (Coolify ve production sunucusu)
#    docker-compose.dev.yml   → yerel geliştirme (kaynak kod + hot reload)
#
#  ── İmajı üretip gönderme (tek seferlik, geliştirme makinesinde) ─────────────
#    docker compose -f docker-compose.build.yml build
#    docker compose -f docker-compose.build.yml push
#
#  ── Coolify kurulumu ────────────────────────────────────────────────────────
#  1. Resource Type: **Docker Compose** → aşağıdaki YAML'ı yapıştırın
#  2. Environment Variables:
#         SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#         TMDB_API_KEY, CORS_ORIGINS, TZ
#         DOCKERHUB_USER=<docker hub kullanıcı adınız>
#         IMAGE_TAG=1.1.0            ← sürüm sabitleyin (rollback için şart)
#         PUBLIC_API_URL=https://movieapi.burakaydogan.net.tr
#     (Coolify bunları doğrudan konteynere enjekte eder; `env_file` gerekmez.)
#     ⚠️ Coolify "Docker Image" yerine "Docker Compose" seçin ve görüntüyü
#        elle girin; kaynak klonlaması/yapması gerekmez.
#  3. Domain: api servisine bağlayın → movieapi.burakaydogan.net.tr, port 8000
#  4. Healthcheck tanımlıdır — Coolify yönlendirmeyi buna göre başlatır
#
#  ── Volume politikası ────────────────────────────────────────────────────────
#  Coolify "Persistent Storage" ekranından da volume tanımlayabilirsiniz; bu
#  durumda aşağıdaki `volumes:` bloğunu silip servislerde mount yollarını
#  gösterdiğiniz yolları kullanın. Volume SİLERSENİZ domain güncellemeleri
#  kalıcı olmaz (giriş betiği uyarı basar).
# ══════════════════════════════════════════════════════════════════════════════

name: movieapp

# ── Ortak yapılandırma (iki servis de aynı imajı, aynı hacimleri kullanır) ───
x-app: &app
  # ⚠️ BU DOSYADA `build:` YOKTUR — bilinçli olarak.
  #
  # İmaj Docker Hub'dan ÇEKİLİR. Normal kullanım budur:
  #     docker compose pull     → imajı indir
  #     docker compose up -d    → çalıştır
  #
  # İmajı üretmek/göndermek için ayrı dosya kullanılır:
  #     docker compose -f docker-compose.build.yml build
  #     docker compose -f docker-compose.build.yml push
  #
  # Böylece production sunucusunda kaynak kodu ve Docker build zinciri
  # BULUNMAZ; sunucu yalnızca imajı çeker. Coolify da yalnızca bu dosyayı
  # kullanır.
  #
  # Etiketlendirme: IMAGE_TAG verilmezse `latest`. Sürüm sabitlemek için
  # Coolify'da veya .env'de IMAGE_TAG=1.1.0 verin — `latest` etiketi
  # hareketlidir ve rollback için uygun değildir.
  image: ${DOCKERHUB_USER:-movieapp}/movieapp-api:${IMAGE_TAG:-latest}

  # Eğer görseli kendi makinenizden üretip göndermediyseniz ve yalnızca
  # denemek istiyorsanız, imajı şu komutla yerelde etiketleyin:
  #     docker tag movieapp-api:latest movieapp/movieapp-api:latest

  # Uzun sözdizimi + `required: false`: sunucuda .env yoksa da compose hata
  # vermez (Docker Compose ≥ 2.24 gerekir; .env sürüm kontrolünde tutulmadığı
  # için bu şart). Değerler Coolify UI'dan geliyorsa bu blok gereksizdir.
  env_file:
    - path: .env
      required: false

  volumes:
    # Kontrol.py'nin güncellediği dosyalar — kalıcı olmalı.
    - plugins:/app/Plugins
    # watcher ↔ api iletişimi (kilit + durum JSON'ları ve yeniden yükleme
    # bayrağı).
    - state:/state

  restart: unless-stopped
  init: true

  # Docker'ın 10 saniyelik varsayılan SIGKILL'i, FastAPI'nin graceful
  # shutdown'unu (HTTP oturumlarını kapatma) kesecekti. 40 sn veriyoruz.
  stop_grace_period: 40s

  # Container çıktısını sınırla: uzun süre çalışan watcher logları diski
  # doldurmasın (varsayılan: sınırsız json log).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  # Basit sertleştirme: uygulamanın root yetkisi veya ek capability ihtiyacı yok.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL


services:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    <<: *app
    container_name: movieapp-api
    command: ["api"]

    environment:
      # Operasyonel ayarlar. Sırlar (SUPABASE_*, TMDB_API_KEY) buraya
      # YAZILMAZ: burada geçersiz kılınır ve Coolify'in inject ettiği
      # değerleri boşaltırdı. Onlar env_file / Coolify UI üzerinden gelir.
      TZ: ${TZ:-Europe/Istanbul}
      DEBUG: ${DEBUG:-0}
      API_WORKERS: ${API_WORKERS:-1}

      # Herkese açık adres — yalnızca teşris mesajlarında kullanılır.
      # API'nin kendi adresi: https://movieapi.burakaydogan.net.tr
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://movieapi.burakaydogan.net.tr}

      # ⚠️ API_INTERNAL_URL'YI PUBLIC DOMAIN YAPMAYIN. Buradaki adres
      #    container→container (watcher → api) trafiğidir ve Docker ağında
      #    çalışır. https://movieapi.burakaydogan.net.tr yazarsanız watcher her
      #    yoklamada TLS + DNS + Coolify proxy'sine bağımlı hâle gelir; proxy
      #    API konteyneriyle aynı ağda değilse veya TLS geçici olarak sorun
      #    yaşarsa domain güncelleme SESSİZCE durur.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}

    ports:
      # Coolify bu portu otomatik algılar ve domain yönlendirmesini buna bağlar:
      # movieapi.burakaydogan.net.tr → 8000.
      #
      # ⚠️ API_BIND'i 127.0.0.1 YAPMAYIN (yerel override hariç): Coolify'in
      #    proxy'si konteynere published port üzerinden bağlanır; localhost'a
      #    bağlarsanız domain dışarıdan erişilemez olur.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD", "python", "/app/ops/healthcheck.py", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    networks:
      - movieapp


  # ── Domain güncelleyici ────────────────────────────────────────────────────
  # Günlük 18:00'de ve bir eklenti domaini hata verdiğinde
  # Core/Helpers/Kontrol.py çalıştırır; değişen domainler için API'yi
  # yeniden yükletir.
  domain-updater:
    <<: *app
    container_name: movieapp-domain-updater
    command: ["watcher"]
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Europe/Istanbul}

      # ── Zamanlama ───────────────────────────────────────────────────────
      # Konteyner saat dilimiyle (TZ) yorumlanır. TZ=Europe/Istanbul ise
      # UPDATE_HOUR=18 doğrudan akşam 18:00 demektir.
      UPDATE_HOUR: ${UPDATE_HOUR:-18}
      UPDATE_MINUTE: ${UPDATE_MINUTE:-0}

      # ── Hata tetikleyicisi ──────────────────────────────────────────────
      # Kaç saniyede bir eklenti domainleri yoklanır (varsayılan 5 dk).
      DOMAIN_CHECK_INTERVAL: ${DOMAIN_CHECK_INTERVAL:-300}
      # Kaç ardışık başarısız tur sonrası güncelleme çalışsın (1 = ilk hatada).
      ERROR_THRESHOLD: ${ERROR_THRESHOLD:-1}
      # İki hata kaynaklı güncelleme arasındaki en az bekleme (saniye).
      ERROR_COOLDOWN: ${ERROR_COOLDOWN:-1800}
      # Boş arama sonucunu hata saymak (kapalı: eşleşme yoksa hata değildir).
      PROBE_REQUIRE_RESULTS: ${PROBE_REQUIRE_RESULTS:-0}
      PROBE_QUERY: ${PROBE_QUERY:-matrix}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-45}
      # Watcher'ın açılışta da bir kez güncellemesi (API zaten açılışta yapar).
      RUN_ON_START: ${RUN_ON_START:-0}
      KONTROL_TIMEOUT: ${KONTROL_TIMEOUT:-600}

    depends_on:
      api:
        # API sağlıklı olmadan yoklama yapmanın anlamı yok; ayrıca watcher'ın
        # /api/plugins isteğinde kıvılcım çıkarmasını önler.
        condition: service_healthy
        restart: true

    # Port YOK: watcher dışarıdan erişilebilir olmamalı.
    expose:
      - "8000"

    healthcheck:
      # "Süreç ayakta ama iş yapmıyor" durumunu yakalar: kalp atışı
      # dosyasının yaşı 180 saniyeyi aşarsa unhealthy olur.
      test: ["CMD", "python", "/app/ops/healthcheck.py", "watcher", "--max-age", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - movieapp


volumes:
  # Kontrol.py'nin yazdığı eklenti dosyaları (main_url güncellemeleri).
  plugins:
  # watcher ↔ api durum/bayrak paylaşımı.
  state:

networks:
  movieapp:
    driver: bridge