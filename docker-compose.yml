# ══════════════════════════════════════════════════════════════════════════════
#  MovieApp — PRODUCTION dağıtımı (Docker Hub imajı)
#
#  Bu dosyada `build:` YOKTUR. İmaj Docker Hub'dan çekilir; sunucuda kaynak
#  kodu veya Docker build zinciri bulunmaz.
#
#  İmaj: darkpuye/movieapp-api:latest
#
#  ── Bu dosya neden YAML anchor kullanmıyor? ─────────────────────────────────
#  Önceki sürümde `x-app: &app` + `<<: *app` ile ortak blok kullanılıyordu.
#  Coolify'ın Compose ayrıştırıcısı merge key'i (`<<:`) bazı sürümlerde
#  desteklemediği için ortak yapılandırma DAĞINIK kalıyordu: kod okuyan bir
#  servis sadece `<<: *app` görüp geri kalanı kaçırıyordu. Bu sürümde her
#  servis kendi ayarlarını AÇIKÇA taşır — daha uzun ama tek doğruluk kaynağı var
#  ve her ayrıştırıcıda aynı sonucu verir.
#
#  ── Üç dosyanın görevi ──────────────────────────────────────────────────────
#    docker-compose.build.yml → imajı ÜRET ve Docker Hub'a GÖNDER (geliştirme)
#    docker-compose.yml       → bu dosya; imajı ÇEK ve ÇALIŞTIR (production)
#    docker-compose.dev.yml   → yerel geliştirme (kaynak kod + hot reload)
#
#  ── Coolify kurulumu ────────────────────────────────────────────────────────
#  1. Resource Type: **Docker Compose** → aşağıdaki YAML'ı yapıştırın
#  2. Environment Variables (Coolify bunları konteynere enjekte eder):
#         SUPABASE_URL
#         SUPABASE_ANON_KEY
#         SUPABASE_SERVICE_ROLE_KEY
#         TMDB_API_KEY
#         CORS_ORIGINS
#         TZ=Europe/Istanbul
#         PUBLIC_API_URL=https://movieapi.burakaydogan.net.tr
#     ⚠️ `environment:` bloğuna sır YAZMAYIN — oraya boş bir varsayılan koymak
#        Coolify'in inject ettiği değerleri ezerdi. Sırlar yalnızca UI'dan gelir.
#  3. Domain: api servisine bağlayın → movieapi.burakaydogan.net.tr, port 8000
#  4. Healthcheck tanımlıdır; Coolify yönlendirmeyi buna göre başlatır
#
#  ── Volume politikası ────────────────────────────────────────────────────────
#  Coolify "Persistent Storage" ekranından da volume tanımlayabilirsiniz; bu
#  durumda `volumes:` bloğunu silip servislerde mount yollarını gösterdiğiniz
#  yolları kullanın. Volume SİLERSENİZ domain güncellemeleri kalıcı olmaz
#  (giriş betiği uyarı basır).
#
#  ⚠️ `latest` etiketi HAREKETLİDİR. Yeni sürüm çıktığında bir sonraki
#     deploy otomatik olarak yeni imajı çeker. Geri dönmek istiyorsanız
#     production compose'da etiketi sabit sürüme çevirin (darkpuye/movieapp-api:1.1.0).
# ══════════════════════════════════════════════════════════════════════════════

name: movieapp

services:
  # ══════════════════════════════════════════════════════════════════════════
  #  api — FastAPI + yeniden yükleme denetleyicisi
  # ══════════════════════════════════════════════════════════════════════════
  api:
    image: darkpuye/movieapp-api:latest
    container_name: movieapp-api
    command: ["api"]

    restart: unless-stopped
    init: true

    # Docker'ın 10 saniyelik varsayılan SIGKILL'i, FastAPI'nin graceful
    # shutdown'unu (HTTP oturumlarını kapatma) kesecekti. 40 sn veriyoruz.
    stop_grace_period: 40s

    # Sunucuda .env yoksa da compose hata vermesin (Docker Compose ≥ 2.24).
    # Değerler Coolify UI'dan geliyorsa bu blok gereksizdir.
    env_file:
      - path: .env
        required: false

    environment:
      # Operasyonel ayarlar. Sırlar (SUPABASE_*, TMDB_API_KEY) buraya
      # YAZILMAZ: burada geçersiz kılınır ve Coolify'in inject ettiği
      # değerleri boşaltırdı. Onlar Coolify UI üzerinden gelir.
      TZ: ${TZ:-Europe/Istanbul}
      DEBUG: ${DEBUG:-0}

      # ⚠️ API_WORKERS 1'den fazla OLMAMALI. api/deps.py her worker sürecinde
      #    Core/Helpers/Kontrol.py'yi çalıştırır; eşzamanlı worker'larda aynı
      #    eklenti dosyasına yazma yarışı (dosya bozulması) oluşur.
      API_WORKERS: ${API_WORKERS:-1}

      # Herkese açık adres — yalnızca teşhis mesajlarında kullanılır.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://movieapi.burakaydogan.net.tr}

      # ⚠️ API_INTERNAL_URL'YI PUBLIC DOMAIN YAPMAYIN. Buradaki adres
      #    container→container (watcher → api) trafiğidir ve Docker ağında
      #    çalışır. https://movieapi.burakaydogan.net.tr yazarsanız watcher her
      #    yoklamada TLS + DNS + Coolify proxy'sine bağımlı hâle gelir; proxy
      #    API konteyneriyle aynı ağda değilse domain güncelleme SESSİZCE durur.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}

    labels:
      - coolify.managed=true
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.movieapi.rule=Host(`movieapi.burakaydogan.net.tr`)
      - traefik.http.routers.movieapi.entrypoints=https
      - traefik.http.routers.movieapi.tls=true
      - traefik.http.routers.movieapi.tls.certresolver=letsencrypt
      - traefik.http.routers.movieapi.service=movieapi-svc
      - traefik.http.services.movieapi-svc.loadbalancer.server.port=8000

    volumes:
      # Kontrol.py'nin güncellediği eklenti dosyaları — kalıcı olmalı.
      # Volume olmazsa güncellenen domainler her redeploy'da kaybolur.
      - plugins:/app/Plugins
      # watcher ↔ api iletişimi (kilit, durum JSON'ları, yeniden yükleme bayrağı).
      - state:/state

    healthcheck:
      test: ["CMD", "python", "/app/ops/healthcheck.py", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    # Container çıktısını sınırla: uzun süre çalışan loglar diski doldurmasın.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Basit sertleştirme: uygulamanın root yetkisi veya ek capability ihtiyacı yok.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - movieapp

  # ══════════════════════════════════════════════════════════════════════════
  #  domain-updater — günlük 18:00'de ve domain hatası anında Kontrol.py
  # ══════════════════════════════════════════════════════════════════════════
  domain-updater:
    image: darkpuye/movieapp-api:latest
    container_name: movieapp-domain-updater
    command: ["watcher"]

    restart: unless-stopped
    init: true
    stop_grace_period: 40s

    env_file:
      - path: .env
        required: false

    environment:
      TZ: ${TZ:-Europe/Istanbul}

      # ── Zamanlama ───────────────────────────────────────────────────────
      # Konteyner saat dilimiyle (TZ) yorumlanır. TZ=Europe/Istanbul ise
      # UPDATE_HOUR=18 doğrudan akşam 18:00 demektir.
      UPDATE_HOUR: ${UPDATE_HOUR:-18}
      UPDATE_MINUTE: ${UPDATE_MINUTE:-0}

      # ── Hata tetikleyicisi ──────────────────────────────────────────────
      # Kaç saniyede bir eklenti domainleri yoklanır (varsayılan 5 dk).
      DOMAIN_CHECK_INTERVAL: ${DOMAIN_CHECK_INTERVAL:-300}
      # Kaç ardışık başarısız tur sonrası güncelleme çalışsın (1 = ilk hatada).
      ERROR_THRESHOLD: ${ERROR_THRESHOLD:-1}
      # İki hata kaynaklı güncelleme arasındaki en az bekleme (saniye).
      ERROR_COOLDOWN: ${ERROR_COOLDOWN:-1800}
      # Boş arama sonucunu hata saymak (kapalı: eşleşme yoksa hata değildir).
      PROBE_REQUIRE_RESULTS: ${PROBE_REQUIRE_RESULTS:-0}
      PROBE_QUERY: ${PROBE_QUERY:-matrix}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-45}
      # Watcher'ın açılışta da bir kez güncellemesi (API zaten açılışta yapar).
      RUN_ON_START: ${RUN_ON_START:-0}
      KONTROL_TIMEOUT: ${KONTROL_TIMEOUT:-600}

      # ⚠️ Aynı tuzak: container→container trafiği, public domain DEĞİL.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}

    volumes:
      # Aynı Plugins volume'ü: güncellenen domainler buraya yazılır ve API
      # yeniden yüklenirken aynı dosyaları okur.
      - plugins:/app/Plugins
      # watcher bu bayrağı yazar, api okur.
      - state:/state

    depends_on:
      api:
        # API sağlıklı olmadan yoklama yapmanın anlamı yok; ayrıca watcher'ın
        # /api/plugins isteğinde kıvılcım çıkarmasını önler.
        condition: service_healthy
        restart: true

    # Port YOK: watcher dışarıdan erişilebilir olmamalı.
    expose:
      - "8000"

    healthcheck:
      # "Süreç ayakta ama iş yapmıyor" durumunu yakalar: kalp atışı
      # dosyasının yaşı 180 saniyeyi aşarsa unhealthy olur.
      test:
        [
          "CMD",
          "python",
          "/app/ops/healthcheck.py",
          "watcher",
          "--max-age",
          "180",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - movieapp

volumes:
  # Kontrol.py'nin yazdığı eklenti dosyaları (main_url güncellemeleri).
  plugins:
  # watcher ↔ api durum/bayrak paylaşımı.
  state:

networks:
  movieapp:
    driver: bridge
